# Ícono de la edición Pro (flavor "pro" → android/app/src/pro/res).
# Regenerar: dart run flutter_launcher_icons -f flutter_launcher_icons-pro.yaml
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon_pro.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_pro.png"
