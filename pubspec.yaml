name: easyspectrum
description: Easy Spectrum — Emulador de ZX Spectrum simple y accesible por EasySoft.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  google_mobile_ads: ^5.1.0
  file_picker: ^9.2.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  ffi: ^2.1.3
  archive: ^4.0.2
  flutter_soloud: ^4.0.4
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/roms/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
